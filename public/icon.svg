<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#38bdf8" stroke-width="6" opacity="0.4" stroke-dasharray="16 12"/>

  <!-- Shield -->
  <path d="M256 80 L384 136 C384 270 328 368 256 424 C184 368 128 270 128 136 Z" fill="url(#shieldGrad)" stroke="#f87171" stroke-width="8"/>

  <!-- Lock Body -->
  <rect x="206" y="230" width="100" height="84" rx="18" fill="#ffffff" stroke="url(#gold)" stroke-width="6"/>

  <!-- Lock Shackle -->
  <path d="M226 230 V194 C226 172 240 154 256 154 C272 154 286 172 286 194 V230" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>

  <!-- Keyhole -->
  <circle cx="256" cy="264" r="10" fill="#0f172a"/>
  <path d="M252 268 L248 292 H264 L260 268 Z" fill="#0f172a"/>

  <!-- Emblem Text (رقيب) -->
  <text x="256" y="375" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#fef08a">رقيب برو</text>
</svg>
